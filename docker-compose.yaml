services:
  mongo:
    image: mongo:7
    container_name: skill-swap-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: skill-swap-test
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    container_name: skill-swap-backend
    restart: unless-stopped
    depends_on:
      - mongo
    env_file:
      - ./backend/.env.compose
    environment:
      NODE_ENV: production
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000
    container_name: skill-swap-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4173:4173"

volumes:
  mongo-data:
